# Agent-specific LLM settings.
# NOTE: Only includes agents that exist in the codebase.
# Removed (non-existent): analysis_agent, code_generator_agent, deep_question, deep_research.
#
# The "visualize" group was kept as reference for future multimodal/provider-based agents;
# the agents listed under it may be implemented later via the ToolRegistry pattern.
visualize:
  review_agent:
    temperature: 0.3
    max_tokens: 2000
question:
  temperature: 0.5
  max_tokens: 3000
chat:
  temperature: 0.7
  max_tokens: 2000
